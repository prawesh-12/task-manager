name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate SSH secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"

      - name: Add SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          if ! ssh-keyscan -T 20 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "Warning: ssh-keyscan failed for $EC2_HOST, continuing with permissive host key mode."
          fi

      - name: Deploy on server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ec2-user/task-manager' }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$EC2_USER@$EC2_HOST" \
            "EC2_APP_DIR='$EC2_APP_DIR' bash -s" <<'EOF'
          set -euo pipefail

          echo "Entering app directory: $EC2_APP_DIR"
          cd "$EC2_APP_DIR"

          echo "Updating code"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e .env -e frontend/.env.production

          echo "Checking required env files"
          test -f .env
          test -f frontend/.env.production

          echo "Setting up backend venv"
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt

          echo "Installing frontend dependencies"
          npm --prefix frontend ci

          echo "Building frontend"
          npm --prefix frontend run build

          echo "Reloading frontend with pm2"
          pm2 startOrReload ecosystem.config.js --only frontend --update-env

          echo "Recreating backend with pm2"
          pm2 delete backend >/dev/null 2>&1 || true
          pm2 start ecosystem.config.js --only backend --update-env

          echo "Checking backend health"
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:5000/health; then
            echo "Backend health check failed. Recent backend logs:"
            pm2 logs backend --lines 120 --nostream
            exit 1
          fi

          pm2 save
          EOF
